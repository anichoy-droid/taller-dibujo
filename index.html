<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspo - Galería Visual</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="browser-window">

        <!-- Barra superior -->
        <header class="top-bar">
            <div class="window-dots">
                <span class="dot pink"></span>
                <span class="dot yellow"></span>
                <span class="dot blue"></span>
            </div>
            <div class="address-bar"></div>
        </header>

        <!-- Área principal -->
        <section class="inspo-board">

            <!-- Imagen 1 -->
            <article class="image-card image-1">
                <div class="photo">
                    <img src="img/Captura de pantalla 2026-10-07 141617.png" alt="Imagen de inspiración 1">
                </div>
                <p class="image-name">Andres Nichoy</p>
            </article>

            <!-- Imagen 2 -->
            <article class="image-card image-2">
                <div class="photo">
                    <img src="img/Captura de pantalla 2026-10-07 141701.png" alt="Imagen de inspiración 2">
                </div>
                <p class="image-name">Jefferson Useche</p>
            </article>

            <!-- Imagen 3 -->
            <article class="image-card image-3">
                <div class="photo">
                    <img src="img/Captura de pantalla 2026-10-07 141733.png" alt="Imagen de inspiración 3">
                </div>
                <p class="image-name">Vismar Mendez</p>
            </article>

            <!-- Imagen 4 -->
            <article class="image-card image-4">
                <div class="photo">
                    <img src="img/Captura de pantalla 2026-10-07 141751.png" alt="Imagen de inspiración 4">
                </div>
                <p class="image-name">Luis Rojas</p>
            </article>

            <!-- Imagen 5 -->
            <article class="image-card image-5">
                <div class="photo">
                    <img src="img/Captura de pantalla 2026-10-07 141812.png" alt="Imagen de inspiración 5">
                </div>
                <p class="image-name">Santiago Hernandez</p>
            </article>

            <!-- Imagen 6 -->
            <article class="image-card image-6">
                <div class="photo">
                    <img src="img/Captura de pantalla 2026-10-07 141828.png" alt="Imagen de inspiración 6">
                </div>
                <p class="image-name">Pablo Gonzalez</p>
            </article>

            <!-- Imagen 7 -->
            <article class="image-card image-7">
                <div class="photo">
                    <img src="img/Captura de pantalla 2026-10-07 141855.png" alt="Imagen de inspiración 7">
                </div>
                <p class="image-name">Andres Gonzalez</p>
            </article>

            <!-- Imagen 8 -->
            <article class="image-card image-8">
                <div class="photo">
                    <img src="img/Captura de pantalla 2026-10-07 144204.png" alt="Imagen de inspiración 8">
                </div>
                <p class="image-name">Jose Melo</p>
            </article>

            <!-- Imagen 9 -->
            <article class="image-card image-9">
                <div class="photo">
                    <img src="img/image1.jpeg" alt="Imagen de inspiración 9">
                </div>
                <p class="image-name">Juan Prince</p>
            </article>

            <!-- Tarjeta central -->
            <div class="center-card">
                <h1>Dibujos</h1>
                <p>Los mejores dibujos de la clase</p>
                <button>Get Started</button>
            </div>

        </section>

    </main>

</body>
</html>
